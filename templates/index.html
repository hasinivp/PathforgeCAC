<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Pathforge CAC{% endblock %}</title>
	<style>
		/* Shared typography, colors, and element sizing. */
		:root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
		* { box-sizing: border-box; }
		/* Center the page layout and style its header and navigation. */
		body { margin: 0; min-height: 100vh; }
		header { background: #fff; border-bottom: 1px solid #e2e8f0; }
		.bar, main, footer { width: min(100% - 2rem, 1100px); margin: 0 auto; }
		.bar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
		.brand { color: inherit; font-weight: 700; font-size: 1.15rem; text-decoration: none; }
		nav { display: flex; flex-wrap: wrap; gap: 1rem; }
		nav a { color: #475569; text-decoration: none; }
		nav a:hover { color: #1d4ed8; }
		/* Main content panel and footer spacing. */
		main { padding: 2rem 0; }
		.content { min-height: 240px; padding: clamp(1.25rem, 4vw, 2rem); background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
		footer { padding: 0 0 2rem; color: #64748b; font-size: .875rem; }
		/* Stack header items on smaller screens. */
		@media (max-width: 560px) { .bar { align-items: flex-start; flex-direction: column; padding: 1rem 0; } }
	</style>
</head>
<body>
	<!-- Shared site header with branding and child-template navigation. -->
	<header>
		<div class="bar">
			<a class="brand" href="/">Pathforge CAC</a>
			<nav aria-label="Main navigation">{% block navigation %}{% endblock %}</nav>
		</div>
	</header>
	<!-- Child templates provide the main page content. -->
	<main>
		<section class="content">{% block content %}{% endblock %}</section>
	</main>
	<!-- Optional footer content supplied by child templates. -->
	<footer>{% block footer %}{% endblock %}</footer>
</body>
</html>
